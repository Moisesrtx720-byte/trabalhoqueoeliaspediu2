<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BarberFlow - Login</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-brand">
            <div class="brand-icon">
                ✂
            </div>

            <h1>Barber<span>Flow</span></h1>

            <p>
                Agende seu corte de forma simples e rápida.
            </p>
        </div>


        <div class="login-card">

            <div class="login-header">
                <h2>Bem-vindo de volta</h2>

                <p>
                    Entre na sua conta para continuar.
                </p>
            </div>

            <div class="form-group">
                    <label for="email">E-mail</label>

                    <div class="input-container">
                        <span>✉</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="seuemail@email.com"
                            required
                        >
                    </div>
                    <p class="erro" id="erroUsuarioEncontrado"></p>
            </div>


            <div class="form-group">
                    <label for="senha">Senha</label>

                    <div class="input-container">
                        <span>🔒</span>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >
                    </div>
            </div>


                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Lembrar de mim
                    </label>

                    <a href="#">Esqueci minha senha</a>

                </div>


                <button onclick="autenticarCliente()" type="submit" class="btn-primary login-button">
                    Entrar
                </button>


            <div class="divider">
                <span>ou</span>
            </div>


            <p class="register-text">
                Ainda não possui uma conta?
                <a href="#">Criar conta</a>
            </p>

        </div>


        <p class="login-footer">
            © 2026 BarberFlow. Todos os direitos reservados.
        </p>

    </div>

<script src="app.js"></script>

</body>
</html>
